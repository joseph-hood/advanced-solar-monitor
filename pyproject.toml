[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eg4mon"
version = "0.1.0"
description = "Always-on monitor for EG4 FlexBOSS/GridBOSS systems with a LiFePO4 state-of-charge model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.37", "plotly>=5.20", "pandas>=2.0"]
mqtt = ["aiomqtt>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
eg4mon = "eg4mon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eg4mon.store" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008", "B905"]  # I/V are the natural names; B008 is the FastAPI idiom

R1: 0.00526         # ohm
tau1: 3470.0        # s
M: 0.2044           # V, hysteresis half-width
gamma: 400.0

q: 4.0e-6           # (0.002)^2 per hour
r: 0.0144           # (0.12 V)^2
ekf_interval: 300.0 # s. r was fitted at 5-min samples; do not lower
